services:
  db:
    image: mariadb:10.4
    container_name: yumeworld-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-yumeworld}
      MYSQL_USER: ${DB_USER:-sara}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - yumeworld_db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: phpMyAdmin para gestionar la BD visualmente
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: yumeworld-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    depends_on:
      db:
        condition: service_healthy
    # Comenta esta sección si no necesitas phpMyAdmin

volumes:
  yumeworld_db_data: