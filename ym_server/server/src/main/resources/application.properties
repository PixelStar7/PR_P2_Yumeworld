spring.application.name=server

# TODO: Passar la configuració a Json extern a la app.
# CONFIGURACIÓ DE LA CONNEXIÓ MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/yumeworld?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓ MÀGICA DE HIBERNATE/JPA
# Això farà que a la consola vegeu les consultes SQL que el servidor fa automàticament
spring.jpa.show-sql=true

# MOLT IMPORTANT: Com que ja teniu la base de dades muntada amb el vostre SQL,
# li diem a Spring que NO intenti crear ni esborrar taules pel seu compte.
spring.jpa.hibernate.ddl-auto=none
